{% extends 'base.html' %}{% block title %}— Register{% endblock %}
{% block content %}
<section class="d-flex align-items-center justify-content-center" style="min-height:80vh;padding:40px 16px;">
  <div class="card p-4 p-md-5 w-100" style="max-width:400px;">
    <h3 class="serif text-center mb-1" style="color:var(--gold);">CapsuleConnect</h3>
    <p class="text-center mb-4" style="color:var(--muted);font-size:.85rem;">Create your account</p>
    <form id="regForm" method="POST" novalidate>
      <div class="mb-3">
        <label class="form-label" style="font-size:.72rem;font-weight:700;text-transform:uppercase;color:var(--muted);">Username</label>
        <div class="input-group"><span class="input-group-text"><i class="fas fa-user fa-sm"></i></span>
          <input type="text" id="un" name="username" class="form-control" placeholder="Choose a username"></div>
      </div>
      <div class="mb-3">
        <label class="form-label" style="font-size:.72rem;font-weight:700;text-transform:uppercase;color:var(--muted);">Email</label>
        <div class="input-group"><span class="input-group-text"><i class="fas fa-envelope fa-sm"></i></span>
          <input type="email" id="em" name="email" class="form-control" placeholder="you@example.com"></div>
      </div>
      <div class="mb-4">
        <label class="form-label" style="font-size:.72rem;font-weight:700;text-transform:uppercase;color:var(--muted);">Password</label>
        <div class="input-group"><span class="input-group-text"><i class="fas fa-lock fa-sm"></i></span>
          <input type="password" id="pw" name="password" class="form-control" placeholder="Min 6 chars with a number"></div>
      </div>
      <button type="submit" class="btn btn-gold w-100 py-2">Create Account</button>
    </form>
    <p class="text-center mt-3" style="font-size:.85rem;color:var(--muted);">Have an account? <a href="{{ url_for('login') }}" style="color:var(--gold);font-weight:600;">Login</a></p>
  </div>
</section>
{% endblock %}
