{% extends 'base.html' %}{% block title %}— Capsule Created{% endblock %}
{% block content %}
<section class="container py-5">
  <div class="card mx-auto text-center p-5" style="max-width:480px;">
    <div class="d-flex align-items-center justify-content-center mx-auto mb-4" style="width:72px;height:72px;border-radius:50%;background:rgba(112,196,154,.15);border:1px solid rgba(112,196,154,.3);">
      <i class="fas fa-lock fa-2x" style="color:var(--unlock);"></i>
    </div>
    <h3 class="serif mb-2">Capsule Locked!</h3>
    <p class="mb-4" style="color:var(--muted);font-size:.9rem;line-height:1.7;">Your capsule has been sealed. It will be revealed on the date you set.</p>
    <div class="d-flex flex-column gap-2">
      <a href="{{ url_for('dashboard') }}" class="btn btn-gold py-2"><i class="fas fa-th-large me-2"></i>View Dashboard</a>
      <a href="{{ url_for('create') }}" class="btn btn-outline-secondary py-2"><i class="fas fa-plus me-2"></i>Create Another</a>
      <a href="{{ url_for('feed') }}" class="btn btn-outline-secondary py-2"><i class="fas fa-home me-2"></i>Go to Feed</a>
    </div>
  </div>
</section>
{% endblock %}
